# Every dependency version for the Android app, in one place (the idiom is ../../../sentio's).
# A native Compose app (../../docs/decisions/0010-native-apps.md). Keep the list short: Compose and
# Material 3 are the UI; the database is the framework's SQLite, the backup crypto is javax.crypto,
# zip and gzip are java.util.zip, the network is HttpURLConnection behind Egress.kt.

[versions]
agp = "8.13.2"
kotlin = "2.2.21"

# SDK levels. minSdk 29 (Android 10): the platform DayNight theme the window starts in, and
# scoped storage everywhere, so every file the app reads or writes outside its own is one the user
# picked in the system picker, with no storage permission at all.
compileSdk = "36"
minSdk = "29"
targetSdk = "36"

activity = "1.9.3"
coreKtx = "1.15.0"
playServicesAuth = "21.3.0"
# The Compose BOM and lifecycle are held where ../../../sentio holds them: the 2026.x BOMs and
# current lifecycle/activity releases declare an AAR-metadata floor of compileSdk 37.
composeBom = "2024.12.01"
lifecycle = "2.8.7"

junit = "4.13.2"
json = "20231013"
sqliteJdbc = "3.41.2.2"

[libraries]
androidx-activity = { module = "androidx.activity:activity", version.ref = "activity" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
# Google sign-in for the Drive backup button (Cloud.kt): the authorization client, which needs no
# client id or secret in the app. The one dependency that is not AndroidX.
play-services-auth = { module = "com.google.android.gms:play-services-auth", version.ref = "playServicesAuth" }

# Compose is a BOM: the androidx.compose artifacts are version-less and take theirs from it.
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material-icons-core = { module = "androidx.compose.material:material-icons-core" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }

junit = { module = "junit:junit", version.ref = "junit" }
json = { module = "org.json:json", version.ref = "json" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
