# Android settings
android.useAndroidX=true
android.nonTransitiveRClass=true

# Heap. This module is one Activity and no annotation processors, so it needs far less than
# ../../../sentio: 2 GB leaves the machine free for the Vite build that feeds it.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1g

org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Let an idle daemon go after 30 minutes rather than Gradle's 3 hours: on a laptop that also runs
# node and a browser, a swapped-out daemon is slower than a cold one.
org.gradle.daemon.idletimeout=1800000

kotlin.incremental=true

# Nothing here is ever read for release signing — see app/build.gradle.kts. Signing inputs come
# from -P flags or the environment so that a committed file can never carry a keystore password.
