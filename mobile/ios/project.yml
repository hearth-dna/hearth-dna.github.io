# XcodeGen manifest — the source of truth for the Xcode project.
#
# Hearth.xcodeproj is generated, not committed (.gitignore, and `make ios-generate`). A committed
# pbxproj is a merge conflict per file added and a place for a team identifier to hide; this file
# is neither.
name: Hearth

options:
  # PLACEHOLDER, like the Android applicationId, and for the same reason: `.example` is the
  # reserved TLD, so nothing here claims a domain anyone owns. Whoever publishes replaces it with
  # the reverse-DNS of a domain they own, and checks it in App Store Connect first — Apple bundle
  # identifiers are first-come and permanent once submitted.
  bundleIdPrefix: example.hearth
  deploymentTarget:
    # iOS 17: the SwiftUI the screens use (ContentUnavailableView, navigationDestination(item:),
    # the two-parameter onChange).
    iOS: "17.0"
  generateEmptyDirectories: false
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    # The version of record. Info.plist reads these rather than repeating them: a literal there is
    # what would ship when the two disagree, and nothing warns.
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

targets:
  Hearth:
    type: application
    platform: iOS
    sources:
      - path: Hearth
        excludes:
          - "**/.DS_Store"
          # Bundled, not compiled — listed below so the build phase is explicit.
          - "PrivacyInfo.xcprivacy"
          - "I18n/**"
          - "Resources/**"
      - path: Hearth/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The web app's string catalogue for the native screens (ADR 0010), copied in by
      # `make mobile-i18n` as one <code>.json per language. A folder reference, not a group:
      # Strings.swift looks for the files under I18n/ in the bundle, and lists that folder to learn
      # which languages ship.
      - path: Hearth/I18n
        type: folder
        buildPhase: resources
        optional: true
      # The knowledge base for the native screens (Native/Kb/Kb.swift), copied from
      # frontend/public/kb.json by `make mobile-kb` and gitignored like the other copies. Bundled at
      # the top level, where Bundle.main finds "kb.json"; a build without it has an empty kb.
      - path: Hearth/Resources/kb.json
        buildPhase: resources
        optional: true
    dependencies:
      # The system zlib, for gzip in the native genome import and restore (Native/Genome/Gzip.swift):
      # `import zlib` finds the header module, and this links the library whatever autolinking does.
      - sdk: libz.tbd
    info:
      path: Hearth/Info.plist
      properties:
        CFBundleDisplayName: Hearth
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.medical
        # Hearth ships no cryptography of its own: the backups' AES-GCM, PBKDF2 and SHA-256 are
        # CryptoKit and CommonCrypto — all of it Apple's, the exempt category. Declaring it spares every upload the export-compliance questionnaire.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # iPad gets all four: the App Store requires it for Split View and Stage Manager unless the
        # app opts out of multitasking, and a record-keeping app has no reason to.
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The cloud backup buttons (Cloud.swift, docs/runbook/cloud-backups.md). Filled from the
        # gitignored .env through build settings; empty means the button is not offered. Both are
        # public identifiers (an iOS OAuth client id, a Dropbox app key), but still account
        # identifiers, so they never appear in this file.
        HearthGoogleClientID: $(HEARTH_GOOGLE_IOS_CLIENT_ID)
        HearthDropboxAppKey: $(HEARTH_DROPBOX_APP_KEY)
        # Shows the app's iCloud container in iCloud Drive as a "Hearth" folder, so the user can
        # see the backup there and it survives the app being deleted.
        NSUbiquitousContainers:
          iCloud.$(PRODUCT_BUNDLE_IDENTIFIER):
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Hearth
            NSUbiquitousContainerSupportedFolderLevels: Any
    # iCloud Drive for the iCloud backup button. The container is named after the bundle id, so it
    # follows HEARTH_APPLICATION_ID; the publisher enables iCloud (CloudDocuments) on that App ID.
    entitlements:
      path: Hearth/Hearth.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
        com.apple.developer.icloud-services:
          - CloudDocuments
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.$(PRODUCT_BUNDLE_IDENTIFIER)
    settings:
      base:
        HEARTH_GOOGLE_IOS_CLIENT_ID: ""
        HEARTH_DROPBOX_APP_KEY: ""
        PRODUCT_BUNDLE_IDENTIFIER: example.hearth.app$(BUNDLE_ID_SUFFIX)
        PRODUCT_NAME: Hearth
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Hearth/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
    scheme:
      testTargets:
        - HearthTests

  HearthTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HearthTests
    dependencies:
      - target: Hearth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.hearth.app.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hearth.app/Hearth"
