# XcodeGen manifest — the source of truth for the Xcode project.
#
# Hearth.xcodeproj is generated, not committed (.gitignore, and `make ios-generate`). A committed
# pbxproj is a merge conflict per file added and a place for a team identifier to hide; this file
# is neither.
name: Hearth

options:
  # PLACEHOLDER, like the Android applicationId, and for the same reason: `.example` is the
  # reserved TLD, so nothing here claims a domain anyone owns. Whoever publishes replaces it with
  # the reverse-DNS of a domain they own, and checks it in App Store Connect first — Apple bundle
  # identifiers are first-come and permanent once submitted.
  bundleIdPrefix: example.hearth
  deploymentTarget:
    # iOS 17: the first WebKit with OPFS synchronous access handles, which the app's SQLite VFS
    # needs (docs/decisions/0002-sqlite-wasm-on-opfs.md). On anything older the database would fall
    # back to memory and every import would vanish when the app closed.
    iOS: "17.0"
  generateEmptyDirectories: false
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.9"
    # The version of record. Info.plist reads these rather than repeating them: a literal there is
    # what would ship when the two disagree, and nothing warns.
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "2"

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig

targets:
  Hearth:
    type: application
    platform: iOS
    sources:
      - path: Hearth
        excludes:
          - "**/.DS_Store"
          # Bundled, not compiled — listed below so the build phase is explicit.
          - "PrivacyInfo.xcprivacy"
          - "Web/**"
      - path: Hearth/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The PWA build, copied in by `make mobile-web`. A folder reference, not a group: the file
      # names inside are Vite's hashed output and change every build, and the directory structure
      # has to survive into the bundle for LocalWebServer to serve it.
      - path: Hearth/Web
        type: folder
        buildPhase: resources
        optional: true
    info:
      path: Hearth/Info.plist
      properties:
        CFBundleDisplayName: Hearth
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.medical
        # Hearth ships no cryptography of its own: the dump's AES-GCM is WebCrypto, inside WebKit,
        # which is Apple's own exempt category. Declaring it spares every upload the
        # export-compliance questionnaire.
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The app talks to one server: its own, on 127.0.0.1, over plain HTTP, because that is the
        # only way to give the web app a trustworthy origin (see LocalWebServer.swift). This is the
        # narrow key — it permits cleartext to local hosts only and leaves the public internet
        # still requiring HTTPS, which is what the BYOK Ask call uses.
        # WKWebView offers "Take Photo" for the Import page's document picker, and iOS ends the
        # app on that tap unless this purpose string is present. The photo goes to the web app like
        # any picked file; the shell keeps nothing.
        NSCameraUsageDescription: >-
          Take a photo of a medical document to read it into your health log. The photo stays on
          this device unless you send it to your own AI provider.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.hearth.app$(BUNDLE_ID_SUFFIX)
        PRODUCT_NAME: Hearth
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Hearth/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          SWIFT_OPTIMIZATION_LEVEL: -Onone
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -O
    scheme:
      testTargets:
        - HearthTests

  HearthTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HearthTests
    dependencies:
      - target: Hearth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: example.hearth.app.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Hearth.app/Hearth"
