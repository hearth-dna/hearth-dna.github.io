name: Deploy backend

# Ships backend/ to Cloud Run on merge to main. Terraform owns the service (env vars, scaling,
# secrets, service account); this only replaces the image, which is why the cloud-run module
# carries `ignore_changes = [image]`. Never add --set-env-vars here: it replaces the whole set.
# Auth is Workload Identity Federation — no long-lived key exists anywhere.

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  SERVICE: hearth-backend
  REPOSITORY: hearth-registry

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    name: Build and deploy
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: gcloud auth configure-docker "${{ secrets.GCP_REGION }}-docker.pkg.dev" --quiet
      - name: Build and push the image
        working-directory: backend
        env:
          IMAGE: ${{ secrets.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/hearth-registry/backend
        run: |
          set -euo pipefail
          docker build -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
          echo "IMAGE_REF=$IMAGE:$GITHUB_SHA" >>"$GITHUB_ENV"
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ secrets.GCP_REGION }}" --image="$IMAGE_REF" --quiet
      - name: Health check
        run: |
          set -euo pipefail
          url="$(gcloud run services describe "$SERVICE" --project="${{ secrets.GCP_PROJECT_ID }}" \
            --region="${{ secrets.GCP_REGION }}" --format='value(status.url)')"
          curl -fsS --retry 6 --retry-delay 5 --retry-all-errors "$url/health"
