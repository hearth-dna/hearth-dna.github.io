name: Tests

# The one suite definition both the PR gate (ci.yml) and the deploy workflows call, so they cannot
# drift. Ported from ../sentio.

on:
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        working-directory: backend
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet + test
        working-directory: backend
        run: go vet ./... && go test ./...

  frontend:
    name: Vitest + tsc + Biome
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Knowledge base is up to date
        run: python3 kb/build_kb.py && git diff --exit-code --ignore-matching-lines='"version"' --ignore-matching-lines='"sha256"' frontend/public/kb.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npx tsc
      - working-directory: frontend
        run: npm run test
      - working-directory: frontend
        run: npm run build
