name: CI

# Tests only. Deployment lives in pages.yml (ADR 0005); nothing here ships bytes anywhere.
#   - the web checks are one job on one runner, so checkout/setup happen once; the phone apps
#     get a job each (a JDK and a macOS runner), started only when their inputs change;
#   - a cheap `git diff` decides which areas to test, so a landing-only push does not install npm,
#     and docs-only PRs never start a runner (paths-ignore below);
#   - hard timeout so a hung step cannot burn hours;
#   - PR runs are cancelled when a newer push arrives.
# No Dependabot version updates: deps get bumped by hand in batches. Security alerts still work
# (repository settings).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'scripts/**'
      - '**.md'
      - '.env.example'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'dependabot[bot]'
    outputs:
      android: ${{ steps.changes.outputs.android }}
      ios: ${{ steps.changes.outputs.ios }}
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed areas
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # PR: diff against the base branch tip (HEAD is the merge commit). Push: diff against the
          # previous tip. Anything else (dispatch, first push, unreachable SHA): treat all as changed.
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null; then
            files="$(git diff --name-only "$BASE_SHA" HEAD)"
            changed() { printf '%s\n' "$files" | grep -qE "$1"; }
          else
            changed() { true; }
          fi
          frontend=false; landing=false
          changed '^(frontend/|kb/|\.github/workflows/)' && frontend=true
          changed '^(landing/|\.github/workflows/)' && landing=true
          # The phone apps take their strings, knowledge base and schema from frontend/, and their
          # tests open mobile/fixtures/, so a change in any of those re-runs them.
          android=false; ios=false
          changed '^(mobile/(android|fixtures)/|frontend/|kb/|Makefile|\.github/workflows/)' && android=true
          changed '^(mobile/(ios|fixtures)/|frontend/|kb/|Makefile|\.github/workflows/)' && ios=true
          printf 'frontend=%s\nlanding=%s\nandroid=%s\nios=%s\n' \
            "$frontend" "$landing" "$android" "$ios" | tee -a "$GITHUB_OUTPUT"

      # Frontend tests ------------------------------------------------------------------------
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Knowledge base is up to date
        if: steps.changes.outputs.frontend == 'true'
        run: python3 kb/build_kb.py && git diff --exit-code --ignore-matching-lines='"version"' --ignore-matching-lines='"sha256"' frontend/public/kb.json
      - name: Biome + tsc + Vitest + build
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npx tsc
          npm run test
          npm run build

      # Landing check --------------------------------------------------------------------------
      - name: Landing pages present
        if: steps.changes.outputs.landing == 'true'
        run: for f in landing/index.html landing/privacy.html landing/terms.html landing/landing.css landing/landing.js landing/sw.js landing/i18n/ru.json; do [ -s "$f" ] || { echo "::error::$f missing"; exit 1; }; done

  # Phone apps. Unit tests only: no signing, no secrets, so they run on pull requests from forks
  # too. Releases live in android-release.yml and ios-release.yml.
  android:
    name: Android tests
    needs: ci
    if: needs.ci.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests
        run: make android-test ANDROID_JAVA_HOME="$JAVA_HOME" ANDROID_SDK_HOME="$ANDROID_HOME"

  ios:
    name: iOS tests
    needs: ci
    if: needs.ci.outputs.ios == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Node copies the web's strings into the app (frontend/scripts/mobile-i18n.mjs, built-ins only).
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install xcodegen
        run: brew install xcodegen
      - name: Unit tests
        run: |
          simulator="$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+' | sort -u | tail -n 1)"
          make ios-test IOS_SIMULATOR="$simulator"
