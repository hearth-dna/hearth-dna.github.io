name: CI

# Tests only. Deployment lives in pages.yml (ADR 0005); nothing here ships bytes anywhere.
#   - one job on one runner, so checkout/setup happen once;
#   - a cheap `git diff` decides which areas to test, so a landing-only push does not install npm
#     or compile Go, and docs-only PRs never start a runner (paths-ignore below);
#   - hard timeout so a hung step cannot burn hours;
#   - PR runs are cancelled when a newer push arrives.
# No Dependabot version updates: deps get bumped by hand in batches. Security alerts still work
# (repository settings).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'scripts/**'
      - '**.md'
      - '.env.example'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  ci:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v7

      - name: Detect changed areas
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # PR: diff against the base branch tip (HEAD is the merge commit). Push: diff against the
          # previous tip. Anything else (dispatch, first push, unreachable SHA): treat all as changed.
          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
             && git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null; then
            files="$(git diff --name-only "$BASE_SHA" HEAD)"
            changed() { printf '%s\n' "$files" | grep -qE "$1"; }
          else
            changed() { true; }
          fi
          backend=false; frontend=false; landing=false
          changed '^(backend/|\.github/workflows/)' && backend=true
          changed '^(frontend/|kb/|\.github/workflows/)' && frontend=true
          changed '^(landing/|\.github/workflows/)' && landing=true
          printf 'backend=%s\nfrontend=%s\nlanding=%s\n' \
            "$backend" "$frontend" "$landing" | tee -a "$GITHUB_OUTPUT"

      # Backend tests ------------------------------------------------------------------------
      - uses: actions/setup-go@v7
        if: steps.changes.outputs.backend == 'true'
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt + vet + test
        if: steps.changes.outputs.backend == 'true'
        working-directory: backend
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./... && go test ./...

      # Frontend tests ------------------------------------------------------------------------
      - uses: actions/setup-node@v7
        if: steps.changes.outputs.frontend == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Knowledge base is up to date
        if: steps.changes.outputs.frontend == 'true'
        run: python3 kb/build_kb.py && git diff --exit-code --ignore-matching-lines='"version"' --ignore-matching-lines='"sha256"' frontend/public/kb.json
      - name: Biome + tsc + Vitest + build
        if: steps.changes.outputs.frontend == 'true'
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npx tsc
          npm run test
          npm run build

      # Landing check --------------------------------------------------------------------------
      - name: Landing pages present
        if: steps.changes.outputs.landing == 'true'
        run: for f in landing/index.html landing/privacy.html landing/terms.html; do [ -s "$f" ] || { echo "::error::$f missing"; exit 1; }; done
