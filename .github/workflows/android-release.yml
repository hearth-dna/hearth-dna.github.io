name: Android release

# Builds the signed Play bundle, and uploads it when asked to. Every credential comes from
# repository secrets (docs/runbook/store-release.md); none of them exists in the repository, so a
# fork running this workflow builds nothing and uploads nothing.
#
# iOS has no counterpart here on purpose: it needs a macOS runner holding a signing certificate,
# which is a larger trust decision than this project has made. Run `make ios-testflight` from a Mac.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track to upload to (empty = build only)'
        required: false
        default: ''
        type: choice
        options: ['', 'internal', 'alpha', 'beta', 'production']

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      # Fail here, with a name, rather than four steps later inside Gradle.
      - name: Check the release secrets are present
        env:
          HEARTH_APPLICATION_ID: ${{ secrets.HEARTH_APPLICATION_ID }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=""
          [ -n "$HEARTH_APPLICATION_ID" ] || missing="$missing HEARTH_APPLICATION_ID"
          [ -n "$ANDROID_KEYSTORE_BASE64" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$ANDROID_KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "See docs/runbook/store-release.md."
            exit 1
          fi

      # Node runs frontend/scripts/mobile-i18n.mjs (built-ins only, no npm install): the apps take
      # their strings from the web's catalogue.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5

      # Outside the workspace and removed in a cleanup step: a keystore in the checkout could be
      # picked up by a later step or an artifact upload.
      - name: Restore the upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.hearth"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$HOME/.hearth/hearth-upload.jks"

      - name: Build the signed bundle
        env:
          HEARTH_APPLICATION_ID: ${{ secrets.HEARTH_APPLICATION_ID }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # The runner's own JDK and SDK, not the Makefile's local-machine defaults.
        run: |
          make android-bundle \
            ANDROID_JAVA_HOME="$JAVA_HOME" \
            ANDROID_SDK_HOME="$ANDROID_HOME" \
            ANDROID_KEYSTORE_PATH="$HOME/.hearth/hearth-upload.jks"

      - name: Upload to Play
        if: inputs.track != ''
        env:
          HEARTH_APPLICATION_ID: ${{ secrets.HEARTH_APPLICATION_ID }}
          PLAY_SERVICE_ACCOUNT_JSON_CONTENT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          [ -n "$PLAY_SERVICE_ACCOUNT_JSON_CONTENT" ] || {
            echo "PLAY_SERVICE_ACCOUNT_JSON is not set — nothing uploaded."; exit 1; }
          key="$(mktemp)"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON_CONTENT" > "$key"
          trap 'rm -f "$key"' EXIT
          cd mobile && bundle install --quiet
          cd .. && make android-publish \
            ANDROID_JAVA_HOME="$JAVA_HOME" \
            PLAY_SERVICE_ACCOUNT_JSON="$key" TRACK="${{ inputs.track }}"

      - name: Remove the keystore
        if: always()
        run: rm -f "$HOME/.hearth/hearth-upload.jks"

      # The AAB is the artifact a human inspects before promoting a track. It is signed with the
      # upload key, which is what Play expects; it holds no secret of its own.
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-aab
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
