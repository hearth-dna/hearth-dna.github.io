name: iOS release

# Archives, exports and optionally uploads the app to TestFlight and submits it for App Store review. Every credential comes from
# repository secrets (docs/runbook/store-release.md); nothing signing-related exists in the
# repository, so a fork running this workflow fails on the first check and uploads nothing.
#
# The Android counterpart is android-release.yml. This one needs a macOS runner, which costs ~10x
# an ubuntu minute, so it never runs on a push to a branch — only on a release tag or by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: 'none keeps the .ipa only; testflight uploads it; app-store uploads it and submits it for review'
        required: false
        default: none
        type: choice
        options: [none, testflight, app-store]
      release:
        description: 'After Apple approves (app-store only): manual waits for a click in the Console, auto releases at once'
        required: false
        default: manual
        type: choice
        options: [manual, auto]

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      # Fail here, with a name, rather than inside xcodebuild twenty minutes later.
      - name: Check the release secrets are present
        env:
          HEARTH_APPLICATION_ID: ${{ secrets.HEARTH_APPLICATION_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          missing=""
          for name in HEARTH_APPLICATION_ID APPLE_TEAM_ID IOS_DIST_CERT_BASE64 IOS_DIST_CERT_PASSWORD \
                      IOS_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_BASE64; do
            eval "value=\$$name"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "See docs/runbook/store-release.md."
            exit 1
          fi

      # Node runs frontend/scripts/mobile-i18n.mjs (built-ins only, no npm install): the apps take
      # their strings from the web's catalogue.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install xcodegen
        run: brew install xcodegen

      # A keychain of its own, unlocked for this job and deleted in the cleanup step: importing a
      # distribution certificate into the runner's login keychain would leave it readable by every
      # later step.
      - name: Import the signing certificate
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/hearth-signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          cert="$(mktemp)"
          trap 'rm -f "$cert"' EXIT
          printf '%s' "$IOS_DIST_CERT_BASE64" | base64 -d > "$cert"
          # -f pkcs12: the temp file has no extension to guess the format from.
          security import "$cert" -f pkcs12 -k "$keychain" -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign stops for a GUI prompt nobody is there to answer and the job
          # hangs until the timeout.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      # The App Store profile the export signs with. Its name goes to `make ios-ipa` through the
      # environment; both come out of the profile itself, so there is nothing else to configure.
      - name: Install the provisioning profile
        env:
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          profile="$RUNNER_TEMP/hearth.mobileprovision"
          printf '%s' "$IOS_PROFILE_BASE64" | base64 -d > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          name="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir" && cp "$profile" "$dir/$uuid.mobileprovision"
          done
          rm -f "$profile" "$RUNNER_TEMP/profile.plist"
          echo "IOS_EXPORT_PROFILE=$name" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"

      - name: Build and verify the .ipa
        env:
          HEARTH_APPLICATION_ID: ${{ secrets.HEARTH_APPLICATION_ID }}
          # Settings links to the source (AGPL-3.0): this repository, whoever's fork it is.
          HEARTH_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          # Optional: unset leaves the cloud backup button out (docs/runbook/cloud-backups.md).
          HEARTH_GOOGLE_IOS_CLIENT_ID: ${{ secrets.HEARTH_GOOGLE_IOS_CLIENT_ID }}
          HEARTH_DROPBOX_APP_KEY: ${{ secrets.HEARTH_DROPBOX_APP_KEY }}
        run: make ios-ipa ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"

      # A tag push has no inputs, so it builds and publishes nothing.
      - name: Upload to TestFlight
        if: inputs.publish == 'testflight' || inputs.publish == 'app-store'
        env:
          HEARTH_APPLICATION_ID: ${{ secrets.HEARTH_APPLICATION_ID }}
          HEARTH_SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cd mobile && bundle install --quiet && cd ..
          make ios-testflight ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            NOTES="${{ github.ref_name }}"

      # Waits for Apple to process the upload (5-30 minutes), then submits that build. The listing
      # itself is edited in the Console; this step never touches it.
      - name: Submit for App Store review
        if: inputs.publish == 'app-store'
        env:
          HEARTH_APPLICATION_ID: ${{ secrets.HEARTH_APPLICATION_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: make ios-submit ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" RELEASE="${{ inputs.release }}"

      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/hearth-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc"

      # No artifact is kept, unlike the Android workflow: the .ipa embeds the provisioning profile,
      # which names the Apple team, and artifacts of a public repository are public.
