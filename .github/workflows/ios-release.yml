name: iOS release

# Archives, exports and optionally uploads the app to TestFlight. Every credential comes from
# repository secrets (docs/runbook/store-release.md); nothing signing-related exists in the
# repository, so a fork running this workflow fails on the first check and uploads nothing.
#
# The Android counterpart is android-release.yml. This one needs a macOS runner, which costs ~10x
# an ubuntu minute, so it never runs on a push to a branch — only on a release tag or by hand.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload the build to TestFlight (otherwise build and keep the .ipa only)'
        required: false
        default: false
        type: boolean

concurrency:
  group: ios-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      # Fail here, with a name, rather than inside xcodebuild twenty minutes later.
      - name: Check the release secrets are present
        env:
          HEARTH_APPLICATION_ID: ${{ secrets.HEARTH_APPLICATION_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
        run: |
          missing=""
          for name in HEARTH_APPLICATION_ID APPLE_TEAM_ID IOS_DIST_CERT_BASE64 \
                      IOS_DIST_CERT_PASSWORD ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_BASE64; do
            eval "value=\$$name"
            [ -n "$value" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "See docs/runbook/store-release.md."
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # A keychain of its own, unlocked for this job and deleted in the cleanup step: importing a
      # distribution certificate into the runner's login keychain would leave it readable by every
      # later step.
      - name: Import the signing certificate
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/hearth-signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          cert="$(mktemp)"
          trap 'rm -f "$cert"' EXIT
          printf '%s' "$IOS_DIST_CERT_BASE64" | base64 -d > "$cert"
          security import "$cert" -k "$keychain" -P "$IOS_DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign stops for a GUI prompt nobody is there to answer and the job
          # hangs until the timeout.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_BASE64: ${{ secrets.ASC_KEY_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s' "$ASC_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"

      - name: Build and verify the .ipa
        env:
          HEARTH_APPLICATION_ID: ${{ secrets.HEARTH_APPLICATION_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: make ios-ipa ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"

      - name: Upload to TestFlight
        if: inputs.upload
        env:
          HEARTH_APPLICATION_ID: ${{ secrets.HEARTH_APPLICATION_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cd mobile && bundle install --quiet && cd ..
          make ios-testflight ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" \
            NOTES="${{ github.ref_name }}"

      - name: Remove the signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/hearth-signing.keychain-db" 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/asc"

      # What a human inspects before promoting the build in App Store Connect. It is signed for
      # distribution and holds no secret of its own.
      - uses: actions/upload-artifact@v4
        with:
          name: hearth-ipa
          path: mobile/ios/build/ipa/Hearth.ipa
          retention-days: 14
